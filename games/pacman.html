<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pac-Man 2D</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"></head><body><div class="game-wrap"><div class="topbar"><a href="../index.html">← المعرض</a><h2>Pac-Man 2D</h2></div><div class="hud"><span id="score">النقاط: 0</span><span id="lvl">المرحلة: 1/3</span><button id="go">ابدأ</button></div><div id="view"></div><p class="hint">اسحب للتحريك</p></div>
<script type="module">
import {makeAudio} from '../audio.js';
import {boot2D,clear} from '../look.js';
const SFX=makeAudio();
const MAP=['###############','#......#......#','#.##.#.#.#.##.#','#o#.........#o#','#.##.###.##.#.#','#.............#','###############'];
const R=MAP.length,C=MAP[0].length, view=document.getElementById('view'), {ctx}=boot2D(view);
let px,py,d,nd,dots,gx,gy,gdir,score,level,alive;
function walk(x,y){return MAP[y|0]&&MAP[y|0][x|0]&&MAP[y|0][x|0]!=='#'}
function spawnDots(){dots=[]; for(let y=0;y<R;y++)for(let x=0;x<C;x++) if('.o'.includes(MAP[y][x])) dots.push({x,y,p:MAP[y][x]==='o'?5:1})}
function reset(){px=1.5;py=5;d={x:1,y:0};nd=d;gx=7;gy=3;gdir=1;score=0;level=1;alive=true;spawnDots();ui();SFX.start()}
function ui(){document.getElementById('score').textContent='النقاط: '+score; document.getElementById('lvl').textContent='المرحلة: '+level+'/3'}
function setDir(x,y){nd={x,y}}
addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1]}; const v=m[e.key]; if(v)setDir(v[0],v[1])});
let sx,sy; view.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
view.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy; if(Math.hypot(dx,dy)<10)return; if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1)});
document.getElementById('go').onclick=reset;
let last=performance.now();
function loop(now){
  const dt=Math.min(.04,(now-last)/1000); last=now;
  if(alive){
    if(walk(px+nd.x*.2,py+nd.y*.2)) d=nd;
    const nx=px+d.x*3.1*dt, ny=py+d.y*3.1*dt; if(walk(nx,ny)){px=nx;py=ny}
    dots=dots.filter(o=>{if(Math.hypot(o.x-px,o.y-py)<.4){score+=o.p;SFX.eat();ui();return false} return true});
    if(!walk(gx+gdir*.15,gy)) gdir*=-1; gx+=gdir*2*dt;
    if(Math.hypot(gx-px,gy-py)<.45){alive=false;SFX.hit()}
    if(!dots.length){if(level<3){level++;SFX.level();px=1.5;py=5;spawnDots();ui()} else {alive=false;SFX.win()}}
  }
  const w=view.clientWidth,h=view.clientHeight,cs=Math.min(w/C,(h-8)/R), ox=(w-cs*C)/2, oy=(h-cs*R)/2;
  clear(ctx,view,'#050814');
  for(let y=0;y<R;y++)for(let x=0;x<C;x++) if(MAP[y][x]==='#'){ctx.fillStyle='#2563eb'; ctx.fillRect(ox+x*cs+1,oy+y*cs+1,cs-2,cs-2)}
  dots.forEach(o=>{ctx.fillStyle='#fde68a'; ctx.beginPath(); ctx.arc(ox+(o.x+.5)*cs,oy+(o.y+.5)*cs,o.p>1?6:2.5,0,7); ctx.fill()});
  ctx.fillStyle='#facc15'; ctx.beginPath(); ctx.arc(ox+(px+.5)*cs,oy+(py+.5)*cs,cs*.35,0,7); ctx.fill();
  ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(ox+(gx+.5)*cs,oy+(gy+.5)*cs,cs*.33,0,7); ctx.fill();
  requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script></body></html>
