<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Pac-Man</title><link href='https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap' rel=stylesheet><link rel=stylesheet href=../style.css></head><body><div class=game-wrap><div class=topbar><a href=../index.html>← المعرض</a><h2>Pac-Man</h2></div><div class=hud><span id=score>النقاط: 0</span><button id=start>ابدأ</button></div><canvas id=c width=560 height=620></canvas><p class=hint>الأسهم أو WASD</p></div><script>
const MAP=['############################','#............##............#','#.####.#####.##.#####.####.#','#o####.#####.##.#####.####o#','#..........................#','#.####.##.########.##.####.#','#......##....##....##......#','######.##### ## #####.######','     #.##          ##.#     ','######.## ###--### ##.######','      .   #    #   .        ','######.## ######## ##.######','     #.##          ##.#     ','######.## ######## ##.######','#............##............#','#.####.#####.##.#####.####.#','#o..##................##..o#','###.##.##.########.##.##.###','#......##....##....##......#','#.##########.##.##########.#','#..........................#','############################'];
const ROWS=MAP.length,COLS=MAP[0].length,TS=20;const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let pac,dir,next,ghosts,dots,score,fright,alive;
function tiles(){dots=[];for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++){if(MAP[y][x]==='.')dots.push({x,y,p:1});if(MAP[y][x]==='o')dots.push({x,y,p:5})}}
function walkable(x,y){const c=MAP[y]&&MAP[y][x];return c&&c!=='#'}
function reset(){pac={x:13.5,y:16};dir={x:-1,y:0};next={x:-1,y:0};ghosts=[{x:13,y:10,c:'#ef4444',dx:1},{x:14,y:10,c:'#22d3ee',dx:-1},{x:12,y:10,c:'#f472b6',dx:1}];tiles();score=0;fright=0;alive=true;document.getElementById('score').textContent='النقاط: 0'}
function tryDir(p,d){return walkable(Math.floor(p.x+d.x*0.51),Math.floor(p.y+d.y*0.51))}
function stepEnt(p,d,spd){if(tryDir(p,d)){p.x+=d.x*spd;p.y+=d.y*spd}if(p.x<0)p.x=COLS-1;if(p.x>COLS-1)p.x=0}
function loop(){if(alive){if(tryDir(pac,next))dir=next;stepEnt(pac,dir,0.12);dots=dots.filter(d=>{if(Math.hypot(d.x+.5-pac.x,d.y+.5-pac.y)<.45){score+=d.p;if(d.p===5)fright=400;document.getElementById('score').textContent='النقاط: '+score;return false}return true});fright=Math.max(0,fright-1);ghosts.forEach(g=>{if(Math.random()<.04)g.dx*=-1;if(!tryDir(g,{x:g.dx,y:0}))g.dx*=-1;stepEnt(g,{x:g.dx,y:0},0.08);if(Math.hypot(g.x-pac.x,g.y-pac.y)<.6){if(fright){g.x=13;g.y=10;score+=10}else alive=false}})}ctx.fillStyle='#07101c';ctx.fillRect(0,0,560,620);for(let y=0;y<ROWS;y++)for(let x=0;x<COLS;x++)if(MAP[y][x]==='#'){ctx.fillStyle='#1d4ed8';ctx.fillRect(x*TS,y*TS+20,TS-1,TS-1)}dots.forEach(d=>{ctx.fillStyle='#fde68a';ctx.beginPath();ctx.arc((d.x+.5)*TS,(d.y+.5)*TS+20,d.p===5?6:2.4,0,7);ctx.fill()});const mouth=.4+.25*Math.sin(Date.now()/80);ctx.fillStyle='#facc15';ctx.beginPath();ctx.moveTo(pac.x*TS,pac.y*TS+20);ctx.arc(pac.x*TS,pac.y*TS+20,10,mouth+Math.atan2(dir.y,dir.x),Math.PI*2-mouth+Math.atan2(dir.y,dir.x));ctx.fill();ghosts.forEach(g=>{ctx.fillStyle=fright?'#93c5fd':g.c;ctx.beginPath();ctx.arc(g.x*TS,g.y*TS+20,10,Math.PI,0);ctx.lineTo(g.x*TS+10,g.y*TS+30);ctx.lineTo(g.x*TS-10,g.y*TS+30);ctx.fill()});if(!alive){ctx.fillStyle='#fff';ctx.font='bold 36px Cairo';ctx.textAlign='center';ctx.fillText('انتهت اللعبة',280,300)}if(!dots.length&&alive){ctx.fillStyle='#fff';ctx.font='bold 36px Cairo';ctx.textAlign='center';ctx.fillText('فزت!',280,300);alive=false}requestAnimationFrame(loop)}
addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1],a:[-1,0],d:[1,0],w:[0,-1],s:[0,1]};const v=m[e.key];if(v)next={x:v[0],y:v[1]}});document.getElementById('start').onclick=reset;reset();loop();
</script></body></html>
