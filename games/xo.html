<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>X O</title><link href='https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap' rel=stylesheet><link rel=stylesheet href=../style.css></head><body><div class=game-wrap><div class=topbar><a href=../index.html>← المعرض</a><h2>إكس أو ثلاثي الأبعاد</h2></div><div class=hud><span id=turn>دورك: X</span><button id=mode>الخصم: كمبيوتر</button><button id=reset>إعادة</button></div><div class=xo-grid id=board></div><p class=hint>ثلاث في صف يفوز</p></div><script>
const boardEl=document.getElementById('board');let cells,vsAI=true,turn='X',over=false;
function lines(b){const L=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(const[a,c,d]of L)if(b[a]&&b[a]===b[c]&&b[a]===b[d])return b[a];return b.every(Boolean)?'تعادل':null}
function aiMove(){const empty=cells.map((v,i)=>v?null:i).filter(v=>v!==null);for(const i of empty){const t=cells.slice();t[i]='O';if(lines(t)==='O')return i}for(const i of empty){const t=cells.slice();t[i]='X';if(lines(t)==='X')return i}if(empty.includes(4))return 4;return empty[Math.floor(Math.random()*empty.length)]}
function render(){boardEl.innerHTML='';cells.forEach((v,i)=>{const b=document.createElement('button');b.className='cell';b.textContent=v||'';b.style.color=v==='X'?'#38bdf8':'#fb7185';b.onclick=()=>play(i);boardEl.appendChild(b)})}
function play(i){if(over||cells[i])return;cells[i]=turn;const w=lines(cells);if(w){over=true;document.getElementById('turn').textContent=w==='تعادل'?'تعادل':('الفائز: '+w);render();return}turn=turn==='X'?'O':'X';document.getElementById('turn').textContent='الدور: '+turn;render();if(vsAI&&turn==='O'&&!over)setTimeout(()=>{const m=aiMove();if(m!=null)play(m)},280)}
function reset(){cells=Array(9).fill('');turn='X';over=false;document.getElementById('turn').textContent='دورك: X';render()}
document.getElementById('reset').onclick=reset;document.getElementById('mode').onclick=e=>{vsAI=!vsAI;e.target.textContent='الخصم: '+(vsAI?'كمبيوتر':'صديق');reset()};reset();
</script></body></html>
