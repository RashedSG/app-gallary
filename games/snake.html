<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Snake 3D</title><link href='https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap' rel=stylesheet><link rel=stylesheet href=../style.css></head><body><div class=game-wrap><div class=topbar><a href=../index.html>← المعرض</a><h2>Nokia Snake المطوّر</h2></div><div class=hud><span id=score>النقاط: 0</span><span id=best>أفضل: 0</span><button id=start>ابدأ / أعد</button></div><canvas id=c width=720 height=720></canvas><p class=hint>الأسهم أو WASD أو السحب · طعام ذهبي = +5</p></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');const N=18;let snake,dir,food,score,tick,alive;const bestKey='snake3d_best';document.getElementById('best').textContent='أفضل: '+(localStorage.getItem(bestKey)||0);
function reset(){snake=[{x:8,y:9},{x:7,y:9},{x:6,y:9}];dir={x:1,y:0};score=0;alive=true;placeFood();draw();if(tick)clearInterval(tick);tick=setInterval(step,140)}
function placeFood(){do{food={x:Math.floor(Math.random()*N),y:Math.floor(Math.random()*N),gold:Math.random()<.18}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function step(){if(!alive)return;const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){alive=false;draw();return}snake.unshift(h);if(h.x===food.x&&h.y===food.y){score+=food.gold?5:1;if(food.gold)snake.push({...snake.at(-1)});document.getElementById('score').textContent='النقاط: '+score;const b=Math.max(score,+(localStorage.getItem(bestKey)||0));localStorage.setItem(bestKey,b);document.getElementById('best').textContent='أفضل: '+b;placeFood()}else snake.pop();draw()}
function iso(x,y,z=0){return{x:360+(x-y)*18,y:80+(x+y)*12-z}}
function drawBox(x,y,h,color){const p=iso(x,y,h),w=17,d=12;ctx.fillStyle=color;ctx.beginPath();ctx.moveTo(p.x,p.y-h);ctx.lineTo(p.x+w,p.y+d-h);ctx.lineTo(p.x,p.y+2*d-h);ctx.lineTo(p.x-w,p.y+d-h);ctx.closePath();ctx.fill();ctx.fillStyle='#0004';ctx.beginPath();ctx.moveTo(p.x,p.y+2*d-h);ctx.lineTo(p.x+w,p.y+d-h);ctx.lineTo(p.x+w,p.y+d);ctx.lineTo(p.x,p.y+2*d);ctx.closePath();ctx.fill()}
function draw(){ctx.clearRect(0,0,720,720);const g=ctx.createLinearGradient(0,0,0,720);g.addColorStop(0,'#10203a');g.addColorStop(1,'#071018');ctx.fillStyle=g;ctx.fillRect(0,0,720,720);for(let y=0;y<N;y++)for(let x=0;x<N;x++)drawBox(x,y,0,(x+y)%2?'#16324a':'#1b3c58');drawBox(food.x,food.y,16,food.gold?'#facc15':'#ef4444');snake.forEach((s,i)=>drawBox(s.x,s.y,18-Math.min(i,8),i?'#22c55e':'#bbf7d0'));if(!alive){ctx.fillStyle='#0008';ctx.fillRect(0,0,720,720);ctx.fillStyle='#fff';ctx.font='bold 42px Cairo';ctx.textAlign='center';ctx.fillText('انتهت اللعبة',360,360)}}
function setDir(x,y){if(dir.x+x===0&&dir.y+y===0)return;dir={x,y}}
addEventListener('keydown',e=>{const k=e.key;if(['ArrowUp','w','W'].includes(k))setDir(0,-1);if(['ArrowDown','s','S'].includes(k))setDir(0,1);if(['ArrowLeft','a','A'].includes(k))setDir(-1,0);if(['ArrowRight','d','D'].includes(k))setDir(1,0)});
let sx,sy;canvas.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});canvas.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1)});
document.getElementById('start').onclick=reset;reset();
</script></body></html>
