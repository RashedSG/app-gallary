<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Bounce</title><link href='https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap' rel=stylesheet><link rel=stylesheet href=../style.css></head><body><div class=game-wrap><div class=topbar><a href=../index.html>← المعرض</a><h2>Bounce</h2></div><div class=hud><span id=lvl>المرحلة: 1</span><button id=start>أعد المرحلة</button></div><canvas id=c width=720 height=420></canvas><p class=hint>أسهم أو لمس يسار/يمين</p></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
const levels=[{ball:[60,300],goal:[660,300],plats:[[0,360,720,60],[200,280,140,20],[400,220,140,20]],stars:[[250,250],[470,190]],spikes:[[340,340,40,20]]},{ball:[40,200],goal:[660,80],plats:[[0,360,240,60],[200,280,180,18],[430,200,160,18],[600,120,120,18],[320,140,80,18]],stars:[[240,250],[500,170],[640,90]],spikes:[[280,340,80,20],[470,340,80,20]]},{ball:[50,80],goal:[660,340],plats:[[0,120,180,18],[220,200,140,18],[400,280,140,18],[560,360,160,60],[0,360,200,60]],stars:[[80,90],[280,170],[460,250]],spikes:[[220,340,80,20],[400,340,90,20]]}];
let L=0,ball,vel,keys={},stars,dead,win;
function load(){const lv=levels[L];ball={x:lv.ball[0],y:lv.ball[1],r:16};vel={x:0,y:0};stars=lv.stars.map(s=>({x:s[0],y:s[1],got:false}));dead=false;win=false;document.getElementById('lvl').textContent='المرحلة: '+(L+1)}
function rectHit(x,y,r,p){return x+r>p[0]&&x-r<p[0]+p[2]&&y+r>p[1]&&y-r<p[1]+p[3]}
function loop(){if(!dead&&!win){vel.x+=(keys.ArrowRight||keys.d?0.55:0)+(keys.ArrowLeft||keys.a?-0.55:0);vel.x*=0.86;vel.y+=0.45;ball.x+=vel.x;ball.y+=vel.y;levels[L].plats.forEach(p=>{if(rectHit(ball.x,ball.y,ball.r,p)&&vel.y>=0&&ball.y<p[1]+12){ball.y=p[1]-ball.r;vel.y=keys.ArrowUp||keys.w?-9:0}});if(ball.y>440||ball.x<0||ball.x>720)dead=true;levels[L].spikes.forEach(s=>{if(rectHit(ball.x,ball.y,ball.r-4,s))dead=true});stars.forEach(s=>{if(!s.got&&Math.hypot(s.x-ball.x,s.y-ball.y)<22)s.got=true});const g=levels[L].goal;if(stars.every(s=>s.got)&&Math.hypot(g[0]-ball.x,g[1]-ball.y)<28){if(L<levels.length-1){L++;load()}else win=true}}const bg=ctx.createLinearGradient(0,0,0,420);bg.addColorStop(0,'#123056');bg.addColorStop(1,'#071018');ctx.fillStyle=bg;ctx.fillRect(0,0,720,420);levels[L].plats.forEach(p=>{ctx.fillStyle='#334155';ctx.fillRect(p[0],p[1],p[2],p[3]);ctx.fillStyle='#64748b';ctx.fillRect(p[0],p[1],p[2],6)});levels[L].spikes.forEach(s=>{ctx.fillStyle='#fb7185';for(let i=0;i<s[2];i+=12){ctx.beginPath();ctx.moveTo(s[0]+i,s[1]+s[3]);ctx.lineTo(s[0]+i+6,s[1]);ctx.lineTo(s[0]+i+12,s[1]+s[3]);ctx.fill()}});stars.forEach(s=>{if(s.got)return;ctx.fillStyle='#facc15';ctx.beginPath();for(let i=0;i<5;i++){const a=-Math.PI/2+i*1.256;ctx.lineTo(s.x+Math.cos(a)*8,s.y+Math.sin(a)*8)}ctx.fill()});const g=levels[L].goal;ctx.fillStyle='#4ade80';ctx.fillRect(g[0]-10,g[1]-22,20,36);const grd=ctx.createRadialGradient(ball.x-4,ball.y-5,3,ball.x,ball.y,16);grd.addColorStop(0,'#fff');grd.addColorStop(1,'#38bdf8');ctx.fillStyle=grd;ctx.beginPath();ctx.arc(ball.x,ball.y,ball.r,0,7);ctx.fill();if(dead){ctx.fillStyle='#fff';ctx.font='bold 32px Cairo';ctx.textAlign='center';ctx.fillText('سقطت! أعد المرحلة',360,200)}if(win){ctx.fillStyle='#fff';ctx.font='bold 32px Cairo';ctx.textAlign='center';ctx.fillText('أكملت كل المراحل',360,200)}requestAnimationFrame(loop)}
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);canvas.ontouchstart=e=>{const r=canvas.getBoundingClientRect();const x=e.touches[0].clientX-r.left;if(x<r.width/2)keys.ArrowLeft=true;else keys.ArrowRight=true;keys.ArrowUp=true};canvas.ontouchend=()=>{keys.ArrowLeft=keys.ArrowRight=keys.ArrowUp=false};document.getElementById('start').onclick=load;load();loop();
</script></body></html>
