<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Space Shooter</title><link href='https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap' rel=stylesheet><link rel=stylesheet href=../style.css></head><body><div class=game-wrap><div class=topbar><a href=../index.html>← المعرض</a><h2>Space Shooter</h2></div><div class=hud><span id=score>النقاط: 0</span><span id=hp>الدرع: 3</span><button id=start>ابدأ</button></div><canvas id=c width=480 height=640></canvas><p class=hint>حرّك الماوس أو إصبعك · إطلاق تلقائي</p></div><script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');let ship,bullets,enemies,stars,score,hp,run,t;
function reset(){ship={x:240,y:560};bullets=[];enemies=[];score=0;hp=3;t=0;run=true;stars=Array.from({length:60},()=>({x:Math.random()*480,y:Math.random()*640,z:Math.random()*2+.4}));document.getElementById('score').textContent='النقاط: 0';document.getElementById('hp').textContent='الدرع: 3'}
function loop(){if(!run)return;t++;ctx.fillStyle='#050814';ctx.fillRect(0,0,480,640);stars.forEach(s=>{s.y+=s.z*3;if(s.y>640)s.y=0;ctx.fillStyle='#fff';ctx.fillRect(s.x,s.y,s.z,s.z*2)});if(t%12===0)bullets.push({x:ship.x,y:ship.y-20});if(t%40===0)enemies.push({x:40+Math.random()*400,y:-20,hp:1+Math.floor(score/20)});bullets.forEach(b=>b.y-=10);bullets=bullets.filter(b=>b.y>-10);enemies.forEach(e=>e.y+=2+score*0.02);enemies.forEach(e=>{bullets.forEach(b=>{if(Math.hypot(b.x-e.x,b.y-e.y)<22){e.hp--;b.y=-99;if(e.hp<=0){e.dead=true;score++;document.getElementById('score').textContent='النقاط: '+score}}});if(Math.hypot(e.x-ship.x,e.y-ship.y)<30){e.dead=true;hp--;document.getElementById('hp').textContent='الدرع: '+hp;if(hp<=0)run=false}});enemies=enemies.filter(e=>!e.dead&&e.y<680);ctx.fillStyle='#38bdf8';bullets.forEach(b=>ctx.fillRect(b.x-2,b.y,4,12));enemies.forEach(e=>{ctx.fillStyle='#fb7185';ctx.beginPath();ctx.moveTo(e.x,e.y+16);ctx.lineTo(e.x-16,e.y-12);ctx.lineTo(e.x+16,e.y-12);ctx.closePath();ctx.fill()});ctx.save();ctx.translate(ship.x,ship.y);ctx.fillStyle='#67e8f9';ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(16,16);ctx.lineTo(0,8);ctx.lineTo(-16,16);ctx.closePath();ctx.fill();ctx.fillStyle='#fbbf24';ctx.fillRect(-3,10,6,10);ctx.restore();if(!run){ctx.fillStyle='#fff';ctx.font='bold 36px Cairo';ctx.textAlign='center';ctx.fillText('انتهت المهمة',240,320)}requestAnimationFrame(loop)}
canvas.onmousemove=e=>{const r=canvas.getBoundingClientRect();ship.x=Math.max(20,Math.min(460,(e.clientX-r.left)*canvas.width/r.width))};
canvas.ontouchmove=e=>{e.preventDefault();const r=canvas.getBoundingClientRect();ship.x=Math.max(20,Math.min(460,(e.touches[0].clientX-r.left)*canvas.width/r.width))};
document.getElementById('start').onclick=reset;reset();loop();
</script></body></html>
