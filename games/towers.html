<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>الأبراج</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="game-wrap">
    <div class="topbar"><a href="../index.html">← المعرض</a><h2>الأبراج</h2></div>
    <div class="hud"><span id="lvl">الطابق: 1/3</span><span id="hp">حياة: 3</span><button id="go">أعد</button></div>
    <div id="view"></div>
    <p class="hint">تسلق وتجنّب البراميل</p>
  </div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {makeAudio} from '../audio.js';
import {bootSide} from '../look.js';
const SFX=makeAudio();
const view=document.getElementById('view');
const {renderer,scene,camera}=bootSide(view,8,0x1b1024);
const floors=[
 {plats:[[0,0,0,14,.35,1.8],[-2,2.2,0,10,.3,1.6],[2,4.3,0,10,.3,1.6],[0,6.4,0,8,.3,1.6]], goal:[0,7.3,0], rate:.9},
 {plats:[[0,0,0,14,.35,1.8],[3,2.1,0,9,.3,1.6],[-3,4.2,0,9,.3,1.6],[2,6.3,0,8,.3,1.6],[-1,8.3,0,7,.3,1.6]], goal:[-1,9.2,0], rate:1.15},
 {plats:[[0,0,0,14,.35,1.8],[-3,2,0,8,.3,1.6],[3,3.8,0,8,.3,1.6],[-2,5.6,0,8,.3,1.6],[2,7.4,0,8,.3,1.6],[0,9.2,0,6,.3,1.6]], goal:[0,10.1,0], rate:1.35}
];
const hero=new THREE.Mesh(new THREE.CapsuleGeometry(.26,.4,6,10), new THREE.MeshStandardMaterial({color:0x38bdf8})); scene.add(hero);
const boss=new THREE.Mesh(new THREE.BoxGeometry(.9,1.1,.7), new THREE.MeshStandardMaterial({color:0xb45309})); scene.add(boss);
let L=0,vel,keys={},plats=[],barrels=[],goal,world=[],dead,win,hp=3,grounded,acc=0;
function wipe(){world.splice(0).forEach(o=>scene.remove(o)); plats=[]; barrels.forEach(b=>scene.remove(b.m)); barrels=[]}
function load(){wipe(); const lv=floors[L]; hero.position.set(-6,.7,0); vel={x:0,y:0}; dead=false; win=false; grounded=false; acc=0; lv.plats.forEach(p=>{const m=new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]), new THREE.MeshStandardMaterial({color:0x92400e,roughness:.55})); m.position.set(p[0],p[1],p[2]); scene.add(m); world.push(m); plats.push({p});}); goal=new THREE.Mesh(new THREE.OctahedronGeometry(.32), new THREE.MeshStandardMaterial({color:0xfacc15,emissive:0xb45309,emissiveIntensity:.4})); goal.position.set(...lv.goal); scene.add(goal); world.push(goal); boss.position.set(lv.goal[0],lv.goal[1]+.9,0); document.getElementById('lvl').textContent='الطابق: '+(L+1)+'/3'; document.getElementById('hp').textContent='حياة: '+hp; SFX.start();}
function hit(px,py,r,p){return px+r>p[0]-p[3]/2 && px-r<p[0]+p[3]/2 && py+r>p[1]-p[4]/2 && py-r<p[1]+p[4]/2}
addEventListener('keydown',e=>keys[e.key]=true); addEventListener('keyup',e=>keys[e.key]=false);
view.addEventListener('pointerdown',e=>{const r=view.getBoundingClientRect(); if(e.clientX-r.left<r.width/2) keys.ArrowLeft=true; else keys.ArrowRight=true; keys[' ']=true;});
view.addEventListener('pointerup',()=>{keys.ArrowLeft=keys.ArrowRight=keys[' ']=false});
document.getElementById('go').onclick=()=>{hp=3; L=0; load()};
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000); last=now; acc+=dt; const lv=floors[L]; if(!dead&&!win){ vel.x+=(keys.ArrowRight||keys.d?20:0)*dt+(keys.ArrowLeft||keys.a?-20:0)*dt; vel.x*=Math.pow(.84,dt*60); vel.y-=24*dt; hero.position.x+=vel.x*dt; hero.position.y+=vel.y*dt; grounded=false; plats.forEach(({p})=>{ if(hit(hero.position.x,hero.position.y,.36,p) && vel.y<=0 && hero.position.y>p[1]){ hero.position.y=p[1]+p[4]/2+.36; vel.y=0; grounded=true; }}); if(grounded && (keys.ArrowUp||keys.w||keys[' '])){ vel.y=9.4; SFX.move(); keys.ArrowUp=keys.w=keys[' ']=false; } if(hero.position.y<-3){hp--; SFX.hit(); if(hp<=0) dead=true; else load()} if(acc>1.15/lv.rate){ acc=0; const m=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.36,10), new THREE.MeshStandardMaterial({color:0x78350f})); m.rotation.z=Math.PI/2; m.position.copy(boss.position); m.position.y-=.4; scene.add(m); barrels.push({m,vx:(Math.random()>.5?1:-1)*2.6,vy:0}); SFX.place(); } barrels.forEach(b=>{ b.vy-=18*dt; b.m.position.x+=b.vx*dt; b.m.position.y+=b.vy*dt; plats.forEach(({p})=>{ if(hit(b.m.position.x,b.m.position.y,.26,p) && b.vy<=0){ b.m.position.y=p[1]+p[4]/2+.26; b.vy=0; }}); if(hero.position.distanceTo(b.m.position)<.5){ hp--; SFX.hit(); document.getElementById('hp').textContent='حياة: '+hp; b.m.position.y=-20; if(hp<=0) dead=true; } }); for(let i=barrels.length-1;i>=0;i--) if(barrels[i].m.position.y<-4){scene.remove(barrels[i].m); barrels.splice(i,1)} if(hero.position.distanceTo(goal.position)<.55){ if(L<2){L++; SFX.level(); load()} else {win=true; SFX.win(); document.getElementById('lvl').textContent='وصلت القمة'} } } camera.position.set(hero.position.x, Math.max(3,hero.position.y+1.8), 18); camera.lookAt(hero.position.x, Math.max(2,hero.position.y+.4), 0); renderer.render(scene,camera); requestAnimationFrame(loop);} load(); requestAnimationFrame(loop);
</script></body></html>
