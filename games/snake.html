<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Snake 2D</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"></head><body><div class="game-wrap"><div class="topbar"><a href="../index.html">← المعرض</a><h2>Snake 2D</h2></div><div class="hud"><span id="score">النقاط: 0</span><span id="lvl">المرحلة: 1/3</span><button id="go">ابدأ</button></div><div id="view"></div><p class="hint">أسهم أو اسحب</p></div>
<script type="module">
import {makeAudio} from '../audio.js';
import {boot2D,clear} from '../look.js';
const SFX=makeAudio(); const view=document.getElementById('view'); const {ctx}=boot2D(view); const N=16;
let snake,dir,nd,food,score,alive,acc=0,step=.16,level=1;
function geom(){const w=view.clientWidth,h=view.clientHeight; const s=Math.floor(Math.min(w,h-8)/N); return {s,ox:(w-s*N)/2,oy:(h-s*N)/2}}
function reset(){snake=[{x:6,y:8},{x:5,y:8},{x:4,y:8}]; dir={x:1,y:0}; nd=dir; score=0; alive=true; acc=0; level=1; step=.16; place(); SFX.start(); ui()}
function place(){do{food={x:(Math.random()*N)|0,y:(Math.random()*N)|0}}while(snake.some(s=>s.x===food.x&&s.y===food.y))}
function ui(){document.getElementById('score').textContent='النقاط: '+score; document.getElementById('lvl').textContent='المرحلة: '+level+'/3'}
function tick(){if(!alive)return; dir=nd; const h={x:snake[0].x+dir.x,y:snake[0].y+dir.y}; if(h.x<0||h.y<0||h.x>=N||h.y>=N||snake.some(s=>s.x===h.x&&s.y===h.y)){alive=false;SFX.hit();return} snake.unshift(h); if(h.x===food.x&&h.y===food.y){score++;SFX.eat(); if(level<3&&score>=level*8){level++;step=Math.max(.09,step-.025);SFX.level()} place()} else snake.pop(); ui()}
function setDir(x,y){if(dir.x+x===0&&dir.y+y===0)return; nd={x,y}}
addEventListener('keydown',e=>{const m={ArrowLeft:[-1,0],a:[-1,0],ArrowRight:[1,0],d:[1,0],ArrowUp:[0,-1],w:[0,-1],ArrowDown:[0,1],s:[0,1]}; const v=m[e.key]; if(v) setDir(v[0],v[1])});
let sx,sy; view.addEventListener('pointerdown',e=>{sx=e.clientX;sy=e.clientY});
view.addEventListener('pointerup',e=>{const dx=e.clientX-sx,dy=e.clientY-sy; if(Math.hypot(dx,dy)<12)return; if(Math.abs(dx)>Math.abs(dy)) setDir(dx>0?1:-1,0); else setDir(0,dy>0?1:-1)});
document.getElementById('go').onclick=reset;
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000); last=now; acc+=dt; while(acc>step){acc-=step;tick()} const {s,ox,oy}=geom(); clear(ctx,view,'#061018');
for(let y=0;y<N;y++)for(let x=0;x<N;x++){ctx.fillStyle=(x+y)%2?'#16324a':'#0f2438';ctx.fillRect(ox+x*s+1,oy+y*s+1,s-2,s-2)}
ctx.fillStyle='#ef4444'; ctx.beginPath(); ctx.arc(ox+food.x*s+s/2,oy+food.y*s+s/2,s*.32,0,7); ctx.fill();
snake.forEach((p,i)=>{ctx.fillStyle=i?'#22c55e':'#bbf7d0'; ctx.beginPath(); ctx.roundRect(ox+p.x*s+3,oy+p.y*s+3,s-6,s-6,6); ctx.fill()});
requestAnimationFrame(loop)} reset(); requestAnimationFrame(loop);
</script></body></html>
