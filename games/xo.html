<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>X O 2D</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="game-wrap">
    <div class="topbar"><a href="../index.html">← المعرض</a><h2>X O 2D</h2></div>
    <div class="hud">
      <span id="turn">دور X</span>
      <span id="lvl">الجولة: 1/3</span>
      <span id="sc">X 0 — 0 O</span>
      <button id="go">إعادة</button>
    </div>
    <div id="view"></div>
    <p class="hint">أنت X · الكمبيوتر O · أفضل 3 جولات</p>
  </div>
<script type="module">
import {makeAudio} from '../audio.js';
import {boot2D,clear} from '../look.js';
const SFX=makeAudio();
const view=document.getElementById('view');
const {ctx}=boot2D(view);
const LINES=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
let cells,turn,locked,round,px,po,busy;
function ui(msg){
  document.getElementById('turn').textContent=msg;
  document.getElementById('lvl').textContent='الجولة: '+round+'/3';
  document.getElementById('sc').textContent='X '+px+' — '+po+' O';
}
function reset(){cells=Array(9).fill('');turn='X';locked=false;busy=false;round=1;px=0;po=0;ui('دور X');SFX.start()}
function winner(b=cells){for(const [a,c,d] of LINES) if(b[a]&&b[a]===b[c]&&b[a]===b[d]) return b[a]; return b.every(Boolean)?'تعادل':null}
function empty(){return cells.map((v,i)=>v?-1:i).filter(i=>i>=0)}
function aiMove(){
  const e=empty();
  for(const i of e){const t=cells.slice(); t[i]='O'; if(winner(t)==='O') return i}
  for(const i of e){const t=cells.slice(); t[i]='X'; if(winner(t)==='X') return i}
  if(e.includes(4)) return 4;
  const corners=e.filter(i=>[0,2,6,8].includes(i));
  if(corners.length) return corners[(Math.random()*corners.length)|0];
  return e[(Math.random()*e.length)|0];
}
function nextRound(w){
  locked=true;
  if(w==='X') px++; else if(w==='O') po++;
  ui(w==='تعادل'?'تعادل':('الفائز: '+w));
  if(round>=3){ SFX.win(); ui('النهاية  X '+px+' — '+po+' O'); return; }
  SFX.eat();
  setTimeout(()=>{cells=Array(9).fill('');turn='X';locked=false;busy=false;round++;ui('دور X');},800);
}
function play(i,who){
  if(locked||busy||i==null||i<0||i>8||cells[i]||who!==turn) return;
  cells[i]=who; SFX.place();
  const w=winner();
  if(w){ nextRound(w); return; }
  turn=who==='X'?'O':'X'; ui('دور '+turn);
  if(turn==='O'){ busy=true; setTimeout(()=>{ busy=false; play(aiMove(),'O'); },280); }
}
function board(){const w=view.clientWidth,h=view.clientHeight,s=Math.min(w,h)*0.78; return {s,x:(w-s)/2,y:(h-s)/2,g:s/3}}
view.addEventListener('pointerdown',e=>{
  if(turn!=='X'||locked||busy) return;
  const r=view.getBoundingClientRect(),b=board();
  const cx=e.clientX-r.left-b.x, cy=e.clientY-r.top-b.y;
  if(cx<0||cy<0||cx>b.s||cy>b.s) return;
  play(((cy/b.g)|0)*3+((cx/b.g)|0),'X');
});
document.getElementById('go').onclick=reset;
function loop(){
  clear(ctx,view,'#0b1020');
  const b=board();
  for(let i=0;i<9;i++){
    const col=i%3,row=(i/3)|0;
    const x=b.x+col*b.g+6, y=b.y+row*b.g+6, s=b.g-12;
    ctx.fillStyle='#1e293b';
    ctx.beginPath(); ctx.roundRect(x,y,s,s,14); ctx.fill();
    if(cells[i]){
      ctx.fillStyle=cells[i]==='X'?'#38bdf8':'#fb7185';
      ctx.font='700 '+Math.floor(s*0.55)+'px Cairo,sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(cells[i], x+s/2, y+s/2+2);
    }
  }
  requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script></body></html>
