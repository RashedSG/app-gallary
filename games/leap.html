<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قفزة 2D</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"></head><body><div class="game-wrap"><div class="topbar"><a href="../index.html">← المعرض</a><h2>قفزة كلاسيكية</h2></div><div class="hud"><span id="lvl">1/3</span><span id="coins">0</span><button id="go">أعد</button></div><div id="view"></div><p class="hint">جري وقفز</p></div>
<script type="module">
import {makeAudio} from '../audio.js';import {boot2D,clear} from '../look.js';
const SFX=makeAudio(),view=document.getElementById('view'),{ctx}=boot2D(view);
const levels=[[{x:0,y:.88,w:1,h:.05},{x:.2,y:.68,w:.18,h:.03},{x:.48,y:.52,w:.18,h:.03},{x:.74,y:.38,w:.2,h:.03}],[{x:0,y:.9,w:.4,h:.04},{x:.5,y:.9,w:.5,h:.04},{x:.28,y:.7,w:.16,h:.03},{x:.55,y:.54,w:.16,h:.03},{x:.78,y:.38,w:.18,h:.03}],[{x:0,y:.9,w:.32,h:.04},{x:.4,y:.74,w:.18,h:.03},{x:.62,y:.58,w:.16,h:.03},{x:.8,y:.4,w:.16,h:.03}]];
let L,plats,x,y,vx,vy,coins,got,dead,win,keys={};
function load(){plats=levels[L].map(p=>({...p}));x=.08;y=.7;vx=0;vy=0;coins=plats.slice(1).map(p=>({x:p.x+p.w/2,y:p.y-.07}));got=new Set();dead=false;win=false;document.getElementById('lvl').textContent=(L+1)+'/3';document.getElementById('coins').textContent='0/'+coins.length}
function reset(){L=0;load()}
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
view.addEventListener('pointerdown',e=>{const r=view.getBoundingClientRect();if(e.clientX-r.left<r.width/2)keys.ArrowLeft=true;else keys.ArrowRight=true;keys[' ']=true});
view.addEventListener('pointerup',()=>{keys.ArrowLeft=keys.ArrowRight=keys[' ']=false});
document.getElementById('go').onclick=reset;
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;const w=view.clientWidth,h=view.clientHeight;
if(!dead&&!win){vx+=(keys.ArrowRight||keys.d?1.8:0)*dt-(keys.ArrowLeft||keys.a?1.8:0)*dt;vx*=Math.pow(.82,dt*60);vy+=2.8*dt;x+=vx*dt;y+=vy*dt;
plats.forEach(p=>{if(x>p.x&&x<p.x+p.w&&y>p.y&&y<p.y+p.h+.05&&vy>=0){y=p.y;vy=0;if(keys.ArrowUp||keys.w||keys[' ']){vy=-1.12;SFX.move();keys[' ']=false}}});
if(y>1.2)dead=true;coins.forEach((c,i)=>{if(!got.has(i)&&Math.hypot(x-c.x,y-c.y)<.06){got.add(i);SFX.gold();document.getElementById('coins').textContent=got.size+'/'+coins.length}});if(got.size===coins.length){if(L<2){L++;load()}else win=true}}
clear(ctx,view,'#6ec6ff');ctx.fillStyle='#c2410c';plats.forEach(p=>ctx.fillRect(p.x*w,p.y*h,p.w*w,Math.max(10,p.h*h)));
ctx.fillStyle='#facc15';coins.forEach((c,i)=>{if(!got.has(i)){ctx.beginPath();ctx.arc(c.x*w,c.y*h,7,0,7);ctx.fill()}});
ctx.fillStyle='#ef4444';ctx.beginPath();ctx.roundRect(x*w-12,y*h-28,24,28,6);ctx.fill();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>
