<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>قفزة كلاسيكية</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="game-wrap">
    <div class="topbar"><a href="../index.html">← المعرض</a><h2>قفزة كلاسيكية</h2></div>
    <div class="hud"><span id="lvl">المرحلة: 1/3</span><span id="coins">عملات: 0</span><span id="hp">حياة: 3</span><button id="go">أعد</button></div>
    <div id="view"></div>
    <p class="hint">WASD · قفز · اجمع العملات وادخل العلم</p>
  </div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {makeAudio} from '../audio.js';
import {bootSide} from '../look.js';
const SFX=makeAudio();
const view=document.getElementById('view');
const {renderer,scene,camera}=bootSide(view,9,0x6ec6ff);
scene.background=new THREE.Color(0x6ec6ff);
const levels=[
 {spawn:[-7,.7,0], flag:[8,1.6,0], plats:[[0,0,0,20,.4,2],[-3,1.6,0,2.2,.3,1.4],[1.5,2.6,0,2.2,.3,1.4],[5.2,1.4,0,2.6,.3,1.4]], coins:[[-3,2.2,0],[1.5,3.2,0],[5.2,2,0],[7.2,1,0]], foes:[[2,.55,0,-1]]},
 {spawn:[-8,.7,0], flag:[10,3.8,0], plats:[[-4,0,0,10,.4,2],[3,0,0,8,.4,2],[-2,1.8,0,2,.3,1.4],[1.2,2.8,0,2,.3,1.4],[5,2.2,0,2.4,.3,1.4],[8.6,3.2,0,3,.3,1.4]], coins:[[-2,2.4,0],[1.2,3.4,0],[5,2.8,0],[8.6,3.8,0]], foes:[[-1,.55,0,1],[4.5,.55,0,-1]]},
 {spawn:[-8,.7,0], flag:[11,5,0], plats:[[-5,0,0,8,.4,2],[2,0,0,6,.4,2],[8,1.6,0,4,.4,2],[-3,2,0,2,.3,1.4],[0.8,3.1,0,2,.3,1.4],[4.2,4,0,2.2,.3,1.4],[8.4,4.4,0,3,.3,1.4]], coins:[[-3,2.6,0],[0.8,3.7,0],[4.2,4.6,0],[8.4,5,0],[10.2,2.2,0]], foes:[[0,.55,0,1],[6,.55,0,-1],[8.2,1.95,0,1]]}
];
const hero=new THREE.Group();
const body=new THREE.Mesh(new THREE.CapsuleGeometry(.28,.42,6,10), new THREE.MeshStandardMaterial({color:0xef4444}));
const hat=new THREE.Mesh(new THREE.CylinderGeometry(.26,.3,.18,10), new THREE.MeshStandardMaterial({color:0xb91c1c}));
hat.position.y=.52; hero.add(body,hat); scene.add(hero);
let L=0,vel,keys={},plats=[],coins=[],foes=[],flag,world=[],dead,win,got,hp=3,grounded;
function wipe(){world.splice(0).forEach(o=>scene.remove(o)); plats=[]; coins=[]; foes=[]}
function addBox(x,y,z,w,h,d,col){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d), new THREE.MeshStandardMaterial({color:col,roughness:.5})); m.position.set(x,y,z); scene.add(m); world.push(m); return m;}
function load(){wipe(); const lv=levels[L]; hero.position.set(...lv.spawn); vel={x:0,y:0}; dead=false; win=false; got=0; grounded=false; lv.plats.forEach(p=>{plats.push({p}); addBox(p[0],p[1],p[2],p[3],p[4],p[5],0xc2410c)}); lv.coins.forEach(c=>{const m=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.06,16), new THREE.MeshStandardMaterial({color:0xfacc15,emissive:0xb45309,emissiveIntensity:.35})); m.rotation.z=Math.PI/2; m.position.set(...c); scene.add(m); world.push(m); coins.push(m);}); lv.foes.forEach(f=>{const m=new THREE.Mesh(new THREE.SphereGeometry(.28,12,10), new THREE.MeshStandardMaterial({color:0x7c3aed})); m.position.set(f[0],f[1],f[2]); scene.add(m); world.push(m); foes.push({m,dir:f[3],x0:f[0]});}); flag=addBox(lv.flag[0],lv.flag[1],0,.16,2.2,.16,0xf8fafc); addBox(lv.flag[0]+.45,lv.flag[1]+.7,0,.9,.7,.08,0x22c55e); document.getElementById('lvl').textContent='المرحلة: '+(L+1)+'/3'; document.getElementById('coins').textContent='عملات: 0/'+coins.length; document.getElementById('hp').textContent='حياة: '+hp; SFX.start();}
function hit(px,py,r,p){return px+r>p[0]-p[3]/2 && px-r<p[0]+p[3]/2 && py+r>p[1]-p[4]/2 && py-r<p[1]+p[4]/2}
addEventListener('keydown',e=>keys[e.key]=true); addEventListener('keyup',e=>keys[e.key]=false);
view.addEventListener('pointerdown',e=>{const r=view.getBoundingClientRect(); if(e.clientX-r.left<r.width/2) keys.ArrowLeft=true; else keys.ArrowRight=true; keys[' ']=true;});
view.addEventListener('pointerup',()=>{keys.ArrowLeft=keys.ArrowRight=keys[' ']=false});
document.getElementById('go').onclick=()=>{hp=3; L=0; load()};
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000); last=now; if(!dead&&!win){ vel.x+=(keys.ArrowRight||keys.d?26:0)*dt+(keys.ArrowLeft||keys.a?-26:0)*dt; vel.x*=Math.pow(.82,dt*60); vel.y-=26*dt; hero.position.x+=vel.x*dt; hero.position.y+=vel.y*dt; grounded=false; plats.forEach(({p})=>{ if(hit(hero.position.x,hero.position.y,.38,p) && vel.y<=0 && hero.position.y>p[1]){ hero.position.y=p[1]+p[4]/2+.38; vel.y=0; grounded=true; }}); if(grounded && (keys.ArrowUp||keys.w||keys[' '])){ vel.y=10.4; SFX.move(); keys.ArrowUp=keys.w=keys[' ']=false; } if(hero.position.y<-4){hp--; SFX.hit(); if(hp<=0) dead=true; else load()} coins.forEach(c=>{if(c.visible && hero.position.distanceTo(c.position)<.5){c.visible=false; got++; SFX.gold(); document.getElementById('coins').textContent='عملات: '+got+'/'+coins.length;}}); foes.forEach(f=>{ f.m.position.x+=f.dir*1.6*dt; if(Math.abs(f.m.position.x-f.x0)>1.8) f.dir*=-1; if(hero.position.distanceTo(f.m.position)<.52){ if(vel.y<0 && hero.position.y>f.m.position.y){ f.m.visible=false; f.m.position.y=-20; vel.y=7; SFX.eat(); } else {hp--; SFX.hit(); document.getElementById('hp').textContent='حياة: '+hp; hero.position.x-=1.2; if(hp<=0) dead=true;} } }); if(got===coins.length && Math.abs(hero.position.x-flag.position.x)<.7){ if(L<2){L++; SFX.level(); load()} else {win=true; SFX.win(); document.getElementById('lvl').textContent='أكملت 3 مراحل'} } } coins.forEach(c=>c.rotation.y+=dt*3); camera.position.x=hero.position.x; camera.position.y=Math.max(2,hero.position.y+1.6); camera.lookAt(hero.position.x,Math.max(1.4,hero.position.y+.3),0); renderer.render(scene,camera); requestAnimationFrame(loop);} load(); requestAnimationFrame(loop);
</script></body></html>
