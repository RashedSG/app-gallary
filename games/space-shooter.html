<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Space Shooter 3D</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <div class="game-wrap">
    <div class="topbar"><a href="../index.html">← المعرض</a><h2>Space Shooter 3D</h2></div>
    <div class="hud"><span id="score">النقاط: 0</span><span id="lvl">الموجة: 1/3</span><span id="hp">الدرع: 3</span><button id="go">ابدأ</button></div>
    <div id="view"></div>
    <p class="hint">حرّك الماوس · إطلاق تلقائي</p>
  </div>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {makeAudio} from '../audio.js';
import {boot3D} from '../look.js';
const SFX=makeAudio();
const view=document.getElementById('view');
const {renderer,scene,camera}=boot3D(view,9,0x030712);
const ship=new THREE.Group();
const body=new THREE.Mesh(new THREE.ConeGeometry(.55,1.6,8), new THREE.MeshStandardMaterial({color:0x67e8f9,metalness:.4,roughness:.3}));
body.rotation.x=Math.PI/2; ship.add(body);
const wing=new THREE.Mesh(new THREE.BoxGeometry(1.8,.12,.4), new THREE.MeshStandardMaterial({color:0x38bdf8}));
wing.position.z=.2; ship.add(wing); ship.position.set(0,0,6); scene.add(ship);
const bullets=[], enemies=[], stars=[];
const bGeo=new THREE.SphereGeometry(.12,8,8), bMat=new THREE.MeshStandardMaterial({color:0xfacc15,emissive:0xf59e0b});
const eGeo=new THREE.ConeGeometry(.55,1.1,6), eMat=new THREE.MeshStandardMaterial({color:0xfb7185,metalness:.3});
for(let i=0;i<80;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(.06,.06,.06), new THREE.MeshBasicMaterial({color:0xffffff})); s.position.set((Math.random()-.5)*18,0,(Math.random()-.5)*18); stars.push(s); scene.add(s);}
let score=0,hp=3,run=true,t=0,targetX=0,wave=1,won=false;
function reset(){score=0;hp=3;run=true;won=false;wave=1;t=0;ship.position.x=0;bullets.splice(0).forEach(b=>scene.remove(b.m));enemies.splice(0).forEach(e=>scene.remove(e.m));document.getElementById('score').textContent='النقاط: 0';document.getElementById('hp').textContent='الدرع: 3';document.getElementById('lvl').textContent='الموجة: 1/3';SFX.start()}
view.addEventListener('pointermove',e=>{const r=view.getBoundingClientRect(); targetX=((e.clientX-r.left)/r.width-.5)*10});
document.getElementById('go').onclick=reset;
let last=performance.now();
function loop(now){const dt=Math.min(.04,(now-last)/1000); last=now; t+=dt; if(run){ ship.position.x+=(targetX-ship.position.x)*Math.min(1,dt*8); if((t*10|0)%3===0 && bullets.length<12){const m=new THREE.Mesh(bGeo,bMat); m.position.copy(ship.position); m.position.z-=1; scene.add(m); bullets.push({m,v:-18}); SFX.shoot();} if(!won && Math.random()<dt*(.9+wave*.4)){const m=new THREE.Mesh(eGeo,eMat); m.rotation.x=-Math.PI/2; m.position.set((Math.random()-.5)*10,0,-22); scene.add(m); enemies.push({m,hp:1+(score/15|0)});} bullets.forEach(b=>b.m.position.z+=b.v*dt); enemies.forEach(e=>e.m.position.z+=(7+score*.04)*dt); bullets.forEach(b=>enemies.forEach(e=>{if(b.m.position.distanceTo(e.m.position)<.9){e.hp--; b.m.position.z=-99; if(e.hp<=0){e.dead=true;score++;SFX.eat();document.getElementById('score').textContent='النقاط: '+score; if(wave<3 && score>=wave*8){wave++;SFX.level();document.getElementById('lvl').textContent='الموجة: '+wave+'/3'} if(wave===3 && score>=24){won=true;run=false;SFX.win();document.getElementById('lvl').textContent='أكملت 3 موجات'}}}})); enemies.forEach(e=>{if(e.m.position.distanceTo(ship.position)<1.2){e.dead=true;hp--;SFX.hit();document.getElementById('hp').textContent='الدرع: '+hp; if(hp<=0) run=false;}}); for(let i=bullets.length-1;i>=0;i--) if(bullets[i].m.position.z<-24){scene.remove(bullets[i].m);bullets.splice(i,1)} for(let i=enemies.length-1;i>=0;i--) if(enemies[i].dead||enemies[i].m.position.z>8){scene.remove(enemies[i].m);enemies.splice(i,1)} } stars.forEach(s=>{s.position.z+=18*dt; if(s.position.z>8) s.position.z=-40}); renderer.render(scene,camera); requestAnimationFrame(loop);}
reset(); requestAnimationFrame(loop);
</script></body></html>
