<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bounce 2D</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"></head><body><div class="game-wrap"><div class="topbar"><a href="../index.html">← المعرض</a><h2>Bounce 2D</h2></div><div class="hud"><span id="lvl">1/3</span><span id="stars">0</span><button id="go">أعد</button></div><div id="view"></div><p class="hint">نصف يسار / نصف يمين + قفز</p></div>
<script type="module">
import {makeAudio} from '../audio.js'; import {boot2D,clear} from '../look.js';
const SFX=makeAudio(), view=document.getElementById('view'), {ctx}=boot2D(view);
const levels=[[{x:0,y:.86,w:1,h:.04},{x:.22,y:.64,w:.2,h:.03},{x:.55,y:.46,w:.2,h:.03}],[{x:0,y:.9,w:.42,h:.04},{x:.52,y:.9,w:.42,h:.04},{x:.3,y:.66,w:.18,h:.03},{x:.62,y:.46,w:.18,h:.03}],[{x:0,y:.9,w:.3,h:.04},{x:.4,y:.7,w:.2,h:.03},{x:.66,y:.5,w:.18,h:.03},{x:.82,y:.32,w:.14,h:.03}]];
let L,plats,x,y,vx,vy,stars,got,dead,win,keys={},gnd;
function load(){plats=levels[L].map(p=>({...p}));x=.1;y=.7;vx=0;vy=0;stars=plats.slice(1).map(p=>({x:p.x+p.w/2,y:p.y-.06}));got=new Set();dead=false;win=false;document.getElementById('lvl').textContent='المرحلة: '+(L+1)+'/3';document.getElementById('stars').textContent='نجوم: 0/'+stars.length}
function reset(){L=0;load()}
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
view.addEventListener('pointerdown',e=>{const r=view.getBoundingClientRect();if(e.clientX-r.left<r.width/2)keys.ArrowLeft=true;else keys.ArrowRight=true;keys[' ']=true});
view.addEventListener('pointerup',()=>{keys.ArrowLeft=keys.ArrowRight=keys[' ']=false});
document.getElementById('go').onclick=reset;
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;const w=view.clientWidth,h=view.clientHeight;
if(!dead&&!win){vx+=(keys.ArrowRight||keys.d?1.6:0)*dt-(keys.ArrowLeft||keys.a?1.6:0)*dt;vx*=Math.pow(.84,dt*60);vy+=2.6*dt;x+=vx*dt;y+=vy*dt;gnd=false;
plats.forEach(p=>{if(x>p.x&&x<p.x+p.w&&y>p.y&&y<p.y+p.h+.04&&vy>=0){y=p.y;vy=0;gnd=true}});
if(gnd&&(keys.ArrowUp||keys.w||keys[' '])){vy=-1.05;SFX.move();keys[' ']=keys.ArrowUp=false}
if(y>1.2){dead=true;SFX.hit()}
stars.forEach((s,i)=>{if(!got.has(i)&&Math.hypot(x-s.x,y-s.y)<.05){got.add(i);SFX.gold();document.getElementById('stars').textContent='نجوم: '+got.size+'/'+stars.length}});
if(got.size===stars.length){if(L<2){L++;load()}else win=true}}
clear(ctx,view,'#082032');ctx.fillStyle='#64748b';plats.forEach(p=>ctx.fillRect(p.x*w,p.y*h,p.w*w,Math.max(8,p.h*h)));
ctx.fillStyle='#facc15';stars.forEach((s,i)=>{if(!got.has(i)){ctx.beginPath();ctx.arc(s.x*w,s.y*h,7,0,7);ctx.fill()}});
ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.arc(x*w,y*h-12,12,0,7);ctx.fill();requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>
