<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Space 2D</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"></head><body><div class="game-wrap"><div class="topbar"><a href="../index.html">← المعرض</a><h2>Space Shooter 2D</h2></div><div class="hud"><span id="score">النقاط: 0</span><span id="lvl">الموجة: 1/3</span><span id="hp">الدرع: 3</span><button id="go">ابدأ</button></div><div id="view"></div><p class="hint">حرّك يمين ويسار</p></div>
<script type="module">
import {makeAudio} from '../audio.js';
import {boot2D,clear} from '../look.js';
const SFX=makeAudio(); const view=document.getElementById('view'); const {ctx}=boot2D(view);
let x,target,bullets,enemies,score,hp,wave,run,t;
function reset(){x=.5;target=.5;bullets=[];enemies=[];score=0;hp=3;wave=1;run=true;t=0;ui();SFX.start()}
function ui(){scoreEl('score','النقاط: '+score); scoreEl('lvl','الموجة: '+wave+'/3'); scoreEl('hp','الدرع: '+hp)}
function scoreEl(id,v){document.getElementById(id).textContent=v}
function aim(e){const r=view.getBoundingClientRect(); target=Math.min(.95,Math.max(.05,(e.clientX-r.left)/r.width))}
view.addEventListener('pointerdown',aim); view.addEventListener('pointermove',aim);
document.getElementById('go').onclick=reset;
let last=performance.now();
function loop(now){
  const dt=Math.min(.04,(now-last)/1000); last=now; t+=dt;
  const w=view.clientWidth,h=view.clientHeight;
  if(run){
    x+=(target-x)*Math.min(1,dt*8);
    if(t>.22){t=0;bullets.push({x:x*w,y:h-70});SFX.shoot()}
    if(Math.random()<dt*(.9+wave*.35)) enemies.push({x:40+Math.random()*(w-80),y:-20});
    bullets.forEach(b=>b.y-=420*dt); enemies.forEach(e=>e.y+=(140+score)*dt);
    bullets.forEach(b=>enemies.forEach(e=>{if(Math.hypot(b.x-e.x,b.y-e.y)<28){e.dead=true;b.y=-9;score++;SFX.eat();if(wave<3&&score>=wave*8){wave++;SFX.level()}ui()}}));
    enemies.forEach(e=>{if(e.y>h-20||Math.hypot(e.x-x*w,e.y-(h-54))<30){e.dead=true;hp--;SFX.hit();ui();if(hp<=0)run=false}});
    bullets=bullets.filter(b=>b.y>-10); enemies=enemies.filter(e=>!e.dead&&e.y<h+30);
  }
  clear(ctx,view,'#030712');
  ctx.fillStyle='#67e8f9'; ctx.beginPath(); ctx.moveTo(x*w,h-88); ctx.lineTo(x*w-18,h-48); ctx.lineTo(x*w+18,h-48); ctx.fill();
  ctx.fillStyle='#facc15'; bullets.forEach(b=>{ctx.beginPath();ctx.arc(b.x,b.y,4,0,7);ctx.fill()});
  ctx.fillStyle='#fb7185'; enemies.forEach(e=>{ctx.beginPath();ctx.moveTo(e.x,e.y+16);ctx.lineTo(e.x-14,e.y-10);ctx.lineTo(e.x+14,e.y-10);ctx.fill()});
  requestAnimationFrame(loop);
}
reset(); requestAnimationFrame(loop);
</script></body></html>
