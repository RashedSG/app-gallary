<!DOCTYPE html><html lang=ar dir=rtl><head><meta charset=UTF-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Bounce 3D</title><link href='https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap' rel=stylesheet><link rel=stylesheet href=../style.css></head><body><div class=game-wrap><div class=topbar><a href=../index.html>← المعرض</a><h2>Bounce 3D</h2></div><div class=hud><span id=lvl>المرحلة: 1</span><span id=stars>نجوم: 0</span><button id=go>أعد المرحلة</button></div><div id=view></div><p class=hint>أسهم أو لمس يسار/يمين</p></div><script type=importmap>{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script><script type=module>
import * as THREE from 'three';
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); view.appendChild(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x082032);
const camera=new THREE.PerspectiveCamera(50,1,.1,80);
scene.add(new THREE.AmbientLight(0x89b4ff,.55)); const sun=new THREE.DirectionalLight(0xffffff,1.1); sun.position.set(6,12,8); scene.add(sun);
function fit(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h);camera.aspect=w/h;camera.updateProjectionMatrix()} addEventListener('resize',fit); fit();
const levels=[{ball:[-6,.6,0], plats:[[0,-.2,0,16,.4,3],[-2,1.2,-.2,3,.3,2],[2,2.2,0,3,.3,2]], stars:[[-2,2,0],[2,3,0]], goal:[6,1.2,0], spikes:[[0,.2,0]]},{ball:[-7,.6,0], plats:[[-5,-.2,0,8,.4,3],[0,1.1,0,3.2,.3,2],[3.5,2.2,0,3,.3,2],[7,3.2,0,3,.3,2]], stars:[[0,1.9,0],[3.5,3,0],[7,4,0]], goal:[7.6,4.1,0], spikes:[[-1,.2,0],[2,.2,0]]}];
const ball=new THREE.Mesh(new THREE.SphereGeometry(.42,20,16), new THREE.MeshStandardMaterial({color:0x38bdf8,metalness:.35,roughness:.25})); scene.add(ball);
let L=0, vel, keys={}, plats=[], starM=[], spikeM=[], goal, world=[], dead, win, got;
function clearW(){world.splice(0).forEach(o=>scene.remove(o)); plats=[]; starM=[]; spikeM=[];}
function load(){clearW(); const lv=levels[L]; ball.position.set(...lv.ball); vel={x:0,y:0}; dead=false; win=false; got=0; lv.plats.forEach(p=>{const m=new THREE.Mesh(new THREE.BoxGeometry(p[3],p[4],p[5]), new THREE.MeshStandardMaterial({color:0x475569,roughness:.6})); m.position.set(p[0],p[1],p[2]); scene.add(m); world.push(m); plats.push({m,p});}); lv.stars.forEach(s=>{const m=new THREE.Mesh(new THREE.OctahedronGeometry(.28), new THREE.MeshStandardMaterial({color:0xfacc15,emissive:0xb45309})); m.position.set(...s); scene.add(m); world.push(m); starM.push(m);}); lv.spikes.forEach(s=>{const m=new THREE.Mesh(new THREE.ConeGeometry(.35,.7,5), new THREE.MeshStandardMaterial({color:0xfb7185})); m.position.set(s[0],s[1],s[2]); scene.add(m); world.push(m); spikeM.push(m);}); goal=new THREE.Mesh(new THREE.CylinderGeometry(.18,.18,.9,10), new THREE.MeshStandardMaterial({color:0x4ade80})); goal.position.set(...lv.goal); scene.add(goal); world.push(goal); document.getElementById('lvl').textContent='المرحلة: '+(L+1); document.getElementById('stars').textContent='نجوم: 0/'+starM.length;}
function aabb(px,py,r,p){return px+r>p[0]-p[3]/2 && px-r<p[0]+p[3]/2 && py+r>p[1]-p[4]/2 && py-r<p[1]+p[4]/2}
addEventListener('keydown',e=>keys[e.key]=true); addEventListener('keyup',e=>keys[e.key]=false);
view.addEventListener('pointerdown',e=>{const r=view.getBoundingClientRect(); if(e.clientX-r.left<r.width/2) keys.ArrowLeft=true; else keys.ArrowRight=true; keys.ArrowUp=true;});
view.addEventListener('pointerup',()=>{keys.ArrowLeft=keys.ArrowRight=keys.ArrowUp=false;});
document.getElementById('go').onclick=()=>{dead=false; load();};
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000); last=now; if(!dead&&!win){ vel.x+=(keys.ArrowRight||keys.d?18:0)*dt+(keys.ArrowLeft||keys.a?-18:0)*dt; vel.x*=Math.pow(.86,dt*60); vel.y-=18*dt; ball.position.x+=vel.x*dt; ball.position.y+=vel.y*dt; plats.forEach(({p})=>{ if(aabb(ball.position.x,ball.position.y,.42,p)&&vel.y<=0&&ball.position.y>p[1]){ ball.position.y=p[1]+p[4]/2+.42; vel.y=(keys.ArrowUp||keys.w)?8:0; }}); if(ball.position.y<-3) dead=true; spikeM.forEach(s=>{if(ball.position.distanceTo(s.position)<.7) dead=true;}); starM.forEach(s=>{if(s.visible&&ball.position.distanceTo(s.position)<.7){s.visible=false; got++; document.getElementById('stars').textContent='نجوم: '+got+'/'+starM.length;}}); if(got===starM.length && ball.position.distanceTo(goal.position)<.8){ if(L<levels.length-1){L++; load();} else win=true; } } starM.forEach(s=>{s.rotation.y+=dt;}); camera.position.set(ball.position.x+6,5.5,10); camera.lookAt(ball.position.x,1,0); renderer.render(scene,camera); requestAnimationFrame(loop);} load(); requestAnimationFrame(loop);
</script></body></html>
