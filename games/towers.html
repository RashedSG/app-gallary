<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الأبراج 2D</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="../style.css"></head><body><div class="game-wrap"><div class="topbar"><a href="../index.html">← المعرض</a><h2>الأبراج</h2></div><div class="hud"><span id="lvl">1/3</span><span id="hp">3</span><button id="go">أعد</button></div><div id="view"></div><p class="hint">تسلق وتجنب البراميل</p></div>
<script type="module">
import {makeAudio} from '../audio.js';import {boot2D,clear} from '../look.js';
const SFX=makeAudio(),view=document.getElementById('view'),{ctx}=boot2D(view);
const floors=[[{x:.08,y:.9,w:.84,h:.035},{x:.16,y:.68,w:.68,h:.03},{x:.22,y:.46,w:.56,h:.03},{x:.3,y:.26,w:.4,h:.03}],[{x:.08,y:.9,w:.84,h:.035},{x:.2,y:.68,w:.6,h:.03},{x:.14,y:.46,w:.6,h:.03},{x:.28,y:.24,w:.5,h:.03}],[{x:.08,y:.92,w:.84,h:.03},{x:.1,y:.72,w:.48,h:.03},{x:.42,y:.54,w:.48,h:.03},{x:.16,y:.36,w:.48,h:.03},{x:.4,y:.18,w:.36,h:.03}]];
let L,plats,x,y,vx,vy,hp,dead,win,keys={},barrels,acc;
function load(){plats=floors[L].map(p=>({...p}));x=.14;y=.82;vx=0;vy=0;dead=false;win=false;barrels=[];acc=0;document.getElementById('lvl').textContent=(L+1)+'/3';document.getElementById('hp').textContent='حياة: '+hp}
function reset(){hp=3;L=0;load()}
addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false);
view.addEventListener('pointerdown',e=>{const r=view.getBoundingClientRect();if(e.clientX-r.left<r.width/2)keys.ArrowLeft=true;else keys.ArrowRight=true;keys[' ']=true});
view.addEventListener('pointerup',()=>{keys.ArrowLeft=keys.ArrowRight=keys[' ']=false});
document.getElementById('go').onclick=reset;
let last=performance.now();
function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;const w=view.clientWidth,h=view.clientHeight;
if(!dead&&!win){vx+=(keys.ArrowRight||keys.d?1.5:0)*dt-(keys.ArrowLeft||keys.a?1.5:0)*dt;vx*=Math.pow(.84,dt*60);vy+=2.5*dt;x+=vx*dt;y+=vy*dt;
plats.forEach(p=>{if(x>p.x&&x<p.x+p.w&&y>p.y&&y<p.y+p.h+.05&&vy>=0){y=p.y;vy=0;if(keys[' ']||keys.ArrowUp){vy=-1;SFX.move();keys[' ']=false}}});
if(y>1.15){hp--;if(hp<=0)dead=true;else load()}
acc+=dt;if(acc>1.15){acc=0;const t=plats.at(-1);barrels.push({x:t.x+t.w/2,y:t.y,vx:(Math.random()>.5?1:-1)*.22,vy:0})}
barrels.forEach(b=>{b.vy+=2.2*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;plats.forEach(p=>{if(b.x>p.x&&b.x<p.x+p.w&&b.y>p.y&&b.y<p.y+.05&&b.vy>=0){b.y=p.y;b.vy=0}});if(Math.hypot(x-b.x,y-b.y)<.045){hp--;b.y=2;document.getElementById('hp').textContent='حياة: '+hp;if(hp<=0)dead=true}});
barrels=barrels.filter(b=>b.y<1.2);const g=plats.at(-1);if(Math.abs(x-(g.x+g.w/2))<.08&&y<g.y+.02){if(L<2){L++;load()}else win=true}}
clear(ctx,view,'#1b1024');ctx.fillStyle='#92400e';plats.forEach(p=>ctx.fillRect(p.x*w,p.y*h,p.w*w,Math.max(10,p.h*h)));
ctx.fillStyle='#78350f';barrels.forEach(b=>{ctx.beginPath();ctx.arc(b.x*w,b.y*h-8,9,0,7);ctx.fill()});
ctx.fillStyle='#38bdf8';ctx.beginPath();ctx.roundRect(x*w-11,y*h-26,22,26,6);ctx.fill();
requestAnimationFrame(loop)}
reset();requestAnimationFrame(loop);
</script></body></html>
